<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wardrobe</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- PERSON 3 — Interface. Plain HTML/JS so it runs with no build step.
       Swap to React later if the team wants; the API stays the same. -->
  <header>
    <h1>Wardrobe</h1>
    <div id="weather" class="weather">Loading weather…</div>
  </header>

  <main>
    <section class="closet">
      <div class="mode">
        <button data-mode="separates" class="active">Top + bottom</button>
        <button data-mode="dress">Dress</button>
      </div>
      <div id="carousels"></div>
    </section>

    <section class="panel">
      <div id="verdict" class="verdict">Pick an outfit</div>
      <div id="score" class="score"></div>
      <ul id="reasons" class="reasons"></ul>

      <div class="actions">
        <button id="suggest">Suggest an outfit</button>
        <button id="like" title="I like this">👍</button>
        <button id="dislike" title="Not for me">👎</button>
        <button id="wear">Wearing this today</button>
      </div>

      <h2>Flat-lay</h2>
      <div id="flatlay" class="flatlay"></div>

      <h2>Add clothes</h2>
      <form id="upload">
        <input type="text" name="name" placeholder="Name, e.g. Blue jumper" required>
        <input type="file" name="photo" accept="image/*" required>
        <button type="submit">Upload</button>
      </form>
      <p id="upload-msg" class="msg"></p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
