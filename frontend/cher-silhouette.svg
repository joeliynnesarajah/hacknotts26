<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 420" width="180" height="420">
  <!-- Default try-on figure: neutral grey bodysuit so any garment layered on top blends in.
       Drawn to the same proportions as an uploaded avatar after the backend scales it into
       the 180x420 frame (fit_to_frame), so one set of garment boxes in try-on.css fits both:
         head top ~4%, neckline ~19%, waistband ~46%, crotch ~53%, ankles ~87%, soles ~97%. -->

  <!-- long blonde hair, behind the body -->
  <path d="M71 26 Q72 9 90 9 Q108 9 109 26 L113 86 Q104 92 98 78 L82 78 Q76 92 67 86 Z" fill="#e2bf5e"/>

  <!-- arms, hanging slightly away from the body; hands end ~57% -->
  <path d="M60 86 Q49 89 47 108 L42 182 Q40 222 39 234 Q38 244 44 245 Q50 244 50 234 L54 184 L61 120 Z" fill="#efc9ab"/>
  <path d="M120 86 Q131 89 133 108 L138 182 Q140 222 141 234 Q142 244 136 245 Q130 244 130 234 L126 184 L119 120 Z" fill="#efc9ab"/>

  <!-- neck and head -->
  <path d="M84 60 L96 60 L97 84 L83 84 Z" fill="#efc9ab"/>
  <ellipse cx="90" cy="40" rx="16.5" ry="21" fill="#f4d3b8"/>
  <path d="M73 36 Q77 18 94 18 Q107 21 107 37 Q96 27 81 32 Z" fill="#e2bf5e"/>
  <ellipse cx="84" cy="41" rx="1.6" ry="2" fill="#5a3b2a"/>
  <ellipse cx="96" cy="41" rx="1.6" ry="2" fill="#5a3b2a"/>
  <path d="M86 51 Q90 54 94 51" stroke="#c2566b" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- legs in grey leggings, ankles ~87% -->
  <path d="M63 190 L117 190 Q119 222 114 252 L109 364 L97 364 L92 230 L88 230 L83 364 L71 364 L66 252 Q61 222 63 190 Z"
        fill="#cfcfcf" stroke="#b3b3b3" stroke-width="1"/>
  <!-- bare ankles -->
  <rect x="72" y="362" width="10" height="12" fill="#efc9ab"/>
  <rect x="98" y="362" width="10" height="12" fill="#efc9ab"/>

  <!-- grey bodysuit top, neckline ~19%, hem ~47% -->
  <path d="M61 86 Q76 80 84 82 Q90 88 96 82 Q104 80 119 86 L121 120 Q118 160 119 197 L61 197 Q62 160 59 120 Z"
        fill="#d9d9d9" stroke="#b3b3b3" stroke-width="1"/>

  <!-- simple pale flats, soles ~97% -->
  <path d="M64 386 Q66 373 77 373 Q86 373 86 386 Q86 406 75 406 Q63 406 64 386 Z" fill="#e8e8e8" stroke="#bdbdbd"/>
  <path d="M94 386 Q94 373 103 373 Q114 373 116 386 Q117 406 105 406 Q94 406 94 386 Z" fill="#e8e8e8" stroke="#bdbdbd"/>
</svg>
