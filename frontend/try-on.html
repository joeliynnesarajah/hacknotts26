<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cher's Wardrobe — Try On</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <style>
    :root {
      --room: #1e1715;
      --bezel: #e4dac4;
      --bezel-dark: #c9bea5;
      --grey: #c0c0c0;
      --hi: #ffffff;
      --lo: #6b6b6b;
      --ink: #111111;
      --blue: #2433b8;
      --good: #1f9e3a;
      --bad: #e0142b;
      --leopard: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' fill='%23d8a25a'/><g fill='%23a9621f' stroke='%232a1a0d' stroke-width='5' stroke-linecap='round' stroke-dasharray='16 7'><ellipse cx='30' cy='28' rx='16' ry='12' transform='rotate(-20 30 28)'/><ellipse cx='100' cy='20' rx='13' ry='10' transform='rotate(15 100 20)'/><ellipse cx='155' cy='58' rx='15' ry='12'/><ellipse cx='65' cy='82' rx='14' ry='11' transform='rotate(30 65 82)'/><ellipse cx='125' cy='108' rx='16' ry='12' transform='rotate(-10 125 108)'/><ellipse cx='25' cy='132' rx='13' ry='11'/><ellipse cx='85' cy='152' rx='15' ry='11' transform='rotate(20 85 152)'/><ellipse cx='158' cy='160' rx='12' ry='10'/></g><g fill='%232a1a0d'><circle cx='62' cy='40' r='4'/><circle cx='140' cy='14' r='3'/><circle cx='100' cy='64' r='3.5'/><circle cx='14' cy='80' r='4'/><circle cx='170' cy='110' r='3'/><circle cx='55' cy='117' r='3'/><circle cx='120' cy='162' r='4'/><circle cx='40' cy='170' r='3'/></g></svg>");
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "VT323", "Courier New", monospace;
      font-size: 20px; color: var(--ink);
      background: radial-gradient(ellipse at center, #3a2c27 0%, var(--room) 70%);
      padding: 16px 12px;
      display: flex; justify-content: center; align-items: flex-start;
    }

    /* ---- CRT Monitor casing ---- */
    .monitor {
      width: 100%; max-width: 960px;
      padding: 24px 24px 36px;
      background: linear-gradient(180deg, var(--bezel) 0%, var(--bezel-dark) 100%);
      border-radius: 24px;
      box-shadow: inset 0 2px 0 #fff8e8, inset 0 -4px 0 #a99e86, 0 20px 50px rgba(0,0,0,.6);
      position: relative;
    }
    .monitor::after {
      content: ""; position: absolute; right: 36px; bottom: 14px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #4cff6a; box-shadow: 0 0 8px #4cff6a;
    }

    .screen {
      position: relative; overflow: hidden; border-radius: 14px;
      background: var(--leopard) #d8a25a;
      border: 4px solid #8f8670;
      box-shadow: inset 0 0 70px rgba(0,0,0,.5);
    }
    .screen::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.1) 0 1px, transparent 1px 3px);
      z-index: 15;
    }

    /* ---- 3D Bevels ---- */
    .titlebar, button, .win-title, .vcr-bar, .slot-picker, .window {
      background: var(--grey);
      border: 2px solid;
      border-color: var(--hi) var(--lo) var(--lo) var(--hi);
    }

    .titlebar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin: 8px 8px 0; padding: 2px 12px;
      font-size: 1.15rem; letter-spacing: .15em; text-transform: uppercase;
    }
    .tag-season {
      background: var(--bezel); border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
      padding: 1px 10px; font-size: 1rem;
    }

    button {
      font: inherit; color: var(--ink); padding: 4px 12px;
      cursor: pointer; text-transform: uppercase; letter-spacing: .08em;
    }
    button:active { border-color: var(--lo) var(--hi) var(--hi) var(--lo); }

    /* ---- Desktop layout ---- */
    .desktop {
      display: grid;
      grid-template-columns: minmax(170px, 190px) minmax(290px, 340px) minmax(190px, 230px);
      justify-content: center;
      gap: 12px;
      padding: 10px 8px;
      align-items: start;
    }

    /* ---- Left: slot pickers ---- */
    .left-panel { display: flex; flex-direction: column; gap: 8px; }
    .slot-picker {
      padding: 6px;
      border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    }
    .slot-picker .win-title {
      background: var(--blue); color: #fff;
      padding: 1px 6px; margin-bottom: 4px;
      font-size: .85rem; text-align: center;
    }
    .slot-picker .item-name {
      text-align: center; font-size: .95rem;
      margin: 3px 0; min-height: 1.2em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .slot-picker .thumb {
      display: block; width: 68px; height: 68px;
      margin: 0 auto; object-fit: contain;
      background: #fff;
      border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo);
    }
    .vcr-bar {
      display: flex; justify-content: center; gap: 3px; padding: 2px;
    }
    .vcr-bar button { padding: 1px 8px; font-size: .85rem; }

    /* ---- Center: Clueless Portrait Stage ---- */
    .center-stage {
      display: flex; flex-direction: column; align-items: center;
    }
    .portrait-frame {
      width: 290px; height: 500px;
      background: radial-gradient(circle at 50% 35%, #b5c7e8 0%, #8ca4cf 100%);
      border: 4px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi);
      box-shadow: inset 0 0 35px rgba(0,0,0,.25), 0 4px 12px rgba(0,0,0,.35);
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    #mannequin {
      position: absolute; inset: 0;
      background-image: url("/static/cher_model.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      transition: background-image .25s ease;
      z-index: 2;
    }

    /* ---- Clothing Overlays ---- */
    .layer {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      pointer-events: none;
      z-index: 3;
      transition: opacity .2s ease;
      display: flex; justify-content: center; align-items: center;
    }
    .layer img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.3));
    }

    /* Perfectly aligned body zones matching Cher's dimensions */
    .layer-top {
      top: 15%; width: 62%; height: 35%;
      z-index: 4;
    }
    .layer-bottom {
      top: 45%; width: 56%; height: 32%;
      z-index: 3;
    }
    .layer-dress {
      top: 15%; width: 62%; height: 62%;
      z-index: 5;
    }
    .layer-shoes {
      top: 85%; width: 50%; height: 14%;
      z-index: 4;
    }
    .layer-outerwear {
      top: 13%; width: 70%; height: 42%;
      z-index: 6;
    }

    /* Slice indicators & arrows directly on mannequin stage */
    .slice-control {
      position: absolute; width: 100%; display: flex; justify-content: space-between;
      padding: 0 4px; z-index: 10; pointer-events: none;
    }
    .slice-control button {
      pointer-events: auto; background: rgba(192, 192, 192, 0.85);
      font-size: .85rem; padding: 1px 6px; border-width: 2px;
      box-shadow: 1px 1px 3px rgba(0,0,0,.4);
    }
    .slice-control button:hover { background: #fff; }
    .slice-top { top: 22%; }
    .slice-bottom { top: 56%; }
    .slice-shoes { top: 88%; }

    /* ---- Right: Status + Avatar panel ---- */
    .right-panel { display: flex; flex-direction: column; gap: 8px; }
    .win-title {
      background: var(--blue); color: #fff;
      padding: 1px 8px; font-size: .85rem;
    }
    .win-body { background: var(--grey); padding: 8px; }
    .verdict {
      font-size: 2.2rem; text-align: center; font-weight: bold;
      line-height: 1.1; margin: 4px 0;
    }
    .verdict.match { color: var(--good); text-shadow: 1px 1px 0 #fff; }
    .verdict.mismatch { color: var(--bad); text-shadow: 1px 1px 0 #fff; animation: blink .7s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }

    .score { text-align: center; font-size: 1rem; margin: 4px 0; font-weight: bold; }
    .reasons {
      list-style: "→ "; padding-left: 14px; margin: 6px 0; font-size: .85rem; line-height: 1.2;
    }

    .avatar-status-badge {
      display: inline-block; background: #fff; border: 1px solid var(--lo);
      padding: 2px 6px; font-size: .85rem; margin-bottom: 6px; width: 100%; text-align: center;
    }
    .avatar-controls { display: flex; gap: 4px; flex-wrap: wrap; }
    .avatar-controls button { flex: 1; font-size: .8rem; padding: 3px 6px; }

    /* ---- Bottom controls ---- */
    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 8px 16px 12px; }
    .big {
      font-size: 1.4rem; padding: 6px 20px; border-width: 3px;
      box-shadow: 3px 3px 0 rgba(0,0,0,.5);
    }
    .big.blue { background: var(--blue); color: #fff; border-color: #6c78e6 #0c1258 #0c1258 #6c78e6; }
    .big.blue:hover { background: #3344d6; }

    .menubar {
      display: flex; justify-content: center; gap: 6px; margin: 0 8px 8px; padding: 4px;
      background: var(--grey); border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi);
    }
    .menubar a {
      font: inherit; color: var(--ink); text-decoration: none; padding: 0 16px;
      text-transform: uppercase; letter-spacing: .08em; display: inline-flex; align-items: center;
      border: 2px solid transparent;
    }
    .menubar a:hover { border-color: var(--hi) var(--lo) var(--lo) var(--hi); }

    /* ---- Retro Stamp Flash ---- */
    .stamp {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 4rem; font-weight: bold; letter-spacing: .1em;
      pointer-events: none; opacity: 0; z-index: 20;
    }
    .stamp.match { color: var(--good); text-shadow: 0 0 15px rgba(31, 158, 58, 0.8), 2px 2px 0 #fff; }
    .stamp.mismatch { color: var(--bad); text-shadow: 0 0 15px rgba(224, 20, 43, 0.8), 2px 2px 0 #fff; }
    .stamp.show { animation: stampflash .9s ease-out forwards; }
    @keyframes stampflash {
      0% { opacity: 1; transform: scale(1.3); }
      20% { opacity: 0; }
      40% { opacity: 1; }
      60% { opacity: 0; }
      80% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1); }
    }

    /* ---- Mobile responsiveness ---- */
    @media (max-width: 820px) {
      body { padding: 0; }
      .monitor { padding: 8px 8px 16px; border-radius: 0; box-shadow: none; }
      .monitor::after { display: none; }
      .screen { border-radius: 0; border: 0; }
      .desktop { grid-template-columns: 1fr; gap: 10px; }
      .center-stage { order: -1; }
      .left-panel { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .slot-picker { width: 140px; }
    }
  </style>
</head>
<body>
  <div class="monitor">
    <div class="screen">
      <header class="titlebar">
        <span>CHER'S WARDROBE</span>
        <span id="season-badge" class="tag-season">[FALL FASHIONS]</span>
      </header>

      <main class="desktop">
        <!-- Left: Slot Pickers -->
        <div class="left-panel" id="pickers"></div>

        <!-- Center: Clueless Portrait Stage -->
        <div class="center-stage">
          <div class="portrait-frame">
            <div id="mannequin">
              <div class="layer layer-shoes" id="layer-shoes"></div>
              <div class="layer layer-bottom" id="layer-bottom"></div>
              <div class="layer layer-dress" id="layer-dress"></div>
              <div class="layer layer-top" id="layer-top"></div>
              <div class="layer layer-outerwear" id="layer-outerwear"></div>
            </div>

            <!-- Mannequin Slice Controls -->
            <div class="slice-control slice-top">
              <button data-cat="top" data-d="-1" title="Previous Top">◀◀</button>
              <button data-cat="top" data-d="1" title="Next Top">▶▶</button>
            </div>
            <div class="slice-control slice-bottom">
              <button data-cat="bottom" data-d="-1" title="Previous Bottom">◀◀</button>
              <button data-cat="bottom" data-d="1" title="Next Bottom">▶▶</button>
            </div>
            <div class="slice-control slice-shoes">
              <button data-cat="shoes" data-d="-1" title="Previous Shoes">◀◀</button>
              <button data-cat="shoes" data-d="1" title="Next Shoes">▶▶</button>
            </div>

            <div id="stamp" class="stamp" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Right: Status & Model Settings -->
        <div class="right-panel">
          <div class="window">
            <div class="win-title">STATUS</div>
            <div class="win-body">
              <div id="verdict" class="verdict">Pick an outfit</div>
              <div id="score-text" class="score"></div>
              <ul id="reasons" class="reasons"></ul>
            </div>
          </div>

          <div class="window">
            <div class="win-title">MODEL</div>
            <div class="win-body">
              <div id="avatar-status" class="avatar-status-badge">Cher Horowitz (Default)</div>
              <div class="avatar-controls">
                <button id="btn-upload-avatar">Upload Photo</button>
                <button id="btn-reset-avatar">Reset</button>
              </div>
              <input type="file" id="avatar-file" accept="image/*" style="display:none">
              <p id="avatar-msg" class="msg" style="margin:4px 0; font-size:.85rem; text-align:center;"></p>
            </div>
          </div>
        </div>
      </main>

      <div class="controls">
        <button id="suggest" class="big blue">Dress me</button>
        <button id="like" class="big">Love it</button>
        <button id="dislike" class="big">As if!</button>
      </div>

      <nav class="menubar">
        <a href="/">← Closet Computer</a>
      </nav>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: opts.body instanceof FormData ? {} : { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ---- State ----
let items = [];
const idx = {
  top: 0,
  bottom: 0,
  shoes: 0,
  dress: -1,
  outerwear: -1, // fixed: never auto-render outerwear by default!
};

function ofCat(cat) { return items.filter((it) => it.category === cat); }
function currentItem(cat) {
  const list = ofCat(cat);
  const i = idx[cat];
  if (i === undefined || i < 0 || i >= list.length) return null;
  return list[i];
}

// ---- Mannequin Layers ----
function renderLayers() {
  const isDress = idx["dress"] !== undefined && idx["dress"] >= 0;

  for (const cat of ["top", "bottom", "dress", "shoes", "outerwear"]) {
    const layer = $(`layer-${cat}`);
    if (!layer) continue;

    // Mutually exclusive: dresses hide top and bottom
    if (isDress && (cat === "top" || cat === "bottom")) {
      layer.innerHTML = "";
      continue;
    }
    if (!isDress && cat === "dress") {
      layer.innerHTML = "";
      continue;
    }

    const item = currentItem(cat);
    if (item && item.image) {
      layer.innerHTML = `<img src="/${item.image}" alt="${esc(item.name)}">`;
    } else {
      layer.innerHTML = "";
    }
  }
}

// ---- Slot Pickers (Left Panel) ----
function renderPickers() {
  const box = $("pickers");
  box.innerHTML = "";

  const cats = ["top", "bottom", "shoes", "dress"];
  for (const cat of cats) {
    const list = ofCat(cat);
    if (list.length === 0) continue;
    const item = currentItem(cat);

    const div = document.createElement("div");
    div.className = "slot-picker";
    div.innerHTML = `
      <div class="win-title">${cat.toUpperCase()}</div>
      <img class="thumb" src="/${item ? item.image : list[0].image}" alt="${item ? esc(item.name) : 'None'}" style="${!item ? 'opacity:0.3' : ''}">
      <div class="item-name" title="${item ? esc(item.name) : 'None'}">${item ? esc(item.name) : '— Off —'}</div>
      <div class="vcr-bar">
        <button data-cat="${cat}" data-d="-1">◀◀</button>
        <button data-cat="${cat}" data-d="1">▶▶</button>
      </div>`;
    box.appendChild(div);
  }

  // Bind VCR buttons
  document.querySelectorAll(".vcr-bar button, .slice-control button").forEach((btn) => {
    btn.onclick = () => {
      cycleSlot(btn.dataset.cat, parseInt(btn.dataset.d, 10));
    };
  });
}

function cycleSlot(cat, delta) {
  const list = ofCat(cat);
  if (!list.length) return;

  if (cat === "dress") {
    // Toggle or cycle dress
    if (idx["dress"] === -1) {
      idx["dress"] = 0;
    } else {
      idx["dress"] = (idx["dress"] + delta + list.length) % list.length;
    }
  } else {
    // If we're cycling top or bottom, deactivate dress mode
    idx["dress"] = -1;
    const cur = idx[cat] >= 0 ? idx[cat] : 0;
    idx[cat] = (cur + delta + list.length) % list.length;
  }

  playClick();
  refresh();
}

// ---- Score and Critique ----
async function scoreCurrent() {
  const outfit = [];
  for (const cat of ["top", "bottom", "dress", "shoes"]) {
    const it = currentItem(cat);
    if (it) outfit.push(it.id);
  }
  if (outfit.length < 2) {
    $("verdict").textContent = "Pick an outfit";
    $("verdict").className = "verdict";
    $("score-text").textContent = "";
    $("reasons").innerHTML = "";
    return;
  }

  try {
    const result = await api("/api/score", {
      method: "POST",
      body: JSON.stringify({ item_ids: outfit }),
    });

    const isMatch = result.verdict === "MATCH";
    $("verdict").textContent = isMatch ? "MATCH!" : "MISMATCH";
    $("verdict").className = "verdict " + (isMatch ? "match" : "mismatch");
    $("score-text").textContent = `Compatibility: ${(result.score * 100).toFixed(0)}%`;
    $("reasons").innerHTML = result.reasons.map((r) => `<li>${esc(r)}</li>`).join("");

    flashStamp($("verdict").textContent, isMatch ? "match" : "mismatch");
  } catch (e) {
    console.error("Score error:", e);
  }
}

// ---- Audio & Stamp ----
function flashStamp(text, kind) {
  const stamp = $("stamp");
  stamp.textContent = text;
  stamp.className = "stamp " + kind;
  void stamp.offsetWidth;
  stamp.classList.add("show");

  if (kind === "mismatch") beepMismatch();
  else if (kind === "match") beepMatch();
}

function playClick() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.04);
  } catch (e) {}
}

function beepMismatch() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const g = ctx.createGain();
    g.connect(ctx.destination);
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    for (const f of [130, 137]) {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f, ctx.currentTime);
      o.connect(g);
      o.start();
      o.stop(ctx.currentTime + 0.35);
    }
  } catch (e) {}
}

function beepMatch() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const g = ctx.createGain();
    g.connect(ctx.destination);
    g.gain.setValueAtTime(0.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
    const chords = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
    chords.forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = "triangle";
      o.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
      o.connect(g);
      o.start(ctx.currentTime + i * 0.08);
      o.stop(ctx.currentTime + i * 0.08 + 0.18);
    });
  } catch (e) {}
}

// ---- Feedback ----
async function sendFeedback(liked) {
  const ids = [];
  for (const cat of ["top", "bottom", "dress", "shoes"]) {
    const it = currentItem(cat);
    if (it) ids.push(it.id);
  }
  if (ids.length < 2) return;
  await api("/api/feedback", { method: "POST", body: JSON.stringify({ item_ids: ids, liked }) });
  scoreCurrent();
}

// ---- Avatar Loader ----
async function loadAvatar() {
  const res = await api("/api/avatar");
  const mann = $("mannequin");
  if (res.url) {
    mann.style.backgroundImage = `url("${res.url}?t=${Date.now()}")`;
    $("avatar-status").textContent = "Your Custom Avatar";
  } else {
    mann.style.backgroundImage = 'url("/static/cher_model.png")';
    $("avatar-status").textContent = "Cher Horowitz (Default)";
  }
}

// ---- Refresh ----
function refresh() {
  renderPickers();
  renderLayers();
  scoreCurrent().catch(console.error);
}

// ---- Init ----
async function init() {
  items = await api("/api/items");

  // Default to first item for top, bottom, shoes
  if (ofCat("top").length) idx["top"] = 0;
  if (ofCat("bottom").length) idx["bottom"] = 0;
  if (ofCat("shoes").length) idx["shoes"] = 0;
  idx["dress"] = -1;
  idx["outerwear"] = -1;

  await loadAvatar();
  refresh();

  // Weather badge
  api("/api/weather").then((w) => {
    const season = (w.season || "fall").toUpperCase();
    $("season-badge").textContent = `[${season} FASHIONS · ${Math.round(w.temperature_c)}°C]`;
  }).catch(() => {});

  // DRESS ME button
  $("suggest").onclick = async () => {
    const [best] = await api("/api/suggest?top_n=5");
    if (best) {
      idx["dress"] = -1;
      for (const id of best.item_ids) {
        const it = items.find((x) => x.id === id);
        if (it) {
          const pos = ofCat(it.category).findIndex((x) => x.id === it.id);
          if (pos >= 0) idx[it.category] = pos;
        }
      }
      playClick();
      refresh();
    } else {
      $("verdict").textContent = "No match today";
    }
  };

  // Feedback buttons
  $("like").onclick = () => sendFeedback(true);
  $("dislike").onclick = () => sendFeedback(false);

  // Avatar upload
  $("btn-upload-avatar").onclick = () => $("avatar-file").click();
  $("avatar-file").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    $("avatar-msg").textContent = "Stripping background…";
    const fd = new FormData();
    fd.append("file", file);
    try {
      await api("/api/avatar", { method: "POST", body: fd });
      await loadAvatar();
      $("avatar-msg").textContent = "Avatar updated!";
    } catch (err) {
      $("avatar-msg").textContent = "Failed: " + err.message;
    }
    e.target.value = "";
  };

  // Reset avatar
  $("btn-reset-avatar").onclick = async () => {
    await api("/api/avatar", { method: "DELETE" });
    await loadAvatar();
    $("avatar-msg").textContent = "Restored Cher.";
  };
}

init().catch((err) => ($("verdict").textContent = "Server offline"));
</script>
</body>
</html>
